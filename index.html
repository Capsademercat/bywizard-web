/* ---------- Detección de país ---------- */
async function detectCountry() {
  // 1) Forzado por URL (?country=ES) → útil para previsualizar cada versión
  const q = new URLSearchParams(location.search).get('country');
  if (q) return q.toUpperCase();
  // 2) Cookie de país (la pone Vercel Edge si se activa; opcional)
  const m = document.cookie.match(/(?:^|;\s*)country=([A-Za-z]{2})/);
  if (m) return m[1].toUpperCase();
  // 3) Geolocalización por IP (con respaldo)
  try {
    const r = await fetch('https://ipapi.co/country/');
    if (r.ok) { const c = (await r.text()).trim().toUpperCase(); if (/^[A-Z]{2}$/.test(c)) return c; }
  } catch (e) {}
  try {
    const r = await fetch('https://api.country.is/');
    if (r.ok) { const j = await r.json(); if (j && j.country) return j.country.toUpperCase(); }
  } catch (e) {}
  return DEFAULT_COUNTRY;
}

    const pill = c.tag ? `<span class="pill">${c.tag}</span>` : '';
    return `
      <a class="card${i === 0 ? ' top' : ''}" href="${c.url}" target="_blank" rel="noopener nofollow sponsored" aria-label="Registrarse en ${c.name}">
        <div class="rank">${i + 1}</div>
        ${logo}
        <div class="info">
          <div class="name">${c.name}</div>
          <div class="deposit">Depósito mínimo <b>${c.deposit}</b></div>
          ${pill}
        </div>
        <div class="cta">→</div>
      </a>`;
  }).join('');

  document.getElementById('cards').innerHTML =
    cards || '<p class="empty">Pronto disponible en tu país 🔜</p>';
  document.getElementById('badges').innerHTML = BADGE_SETS[cfg.badges] || BADGE_SETS.intl;
}

/* ---------- Selector manual (respaldo si la IP falla o usan VPN) ---------- */
function buildSelector(active) {
  const sel = document.getElementById('geo-select');
  sel.innerHTML = Object.entries(COUNTRIES)
    .map(([code, c]) => `<option value="${code}" ${code === active ? 'selected' : ''}>${c.flag} ${c.label}</option>`)
    .join('');
  sel.onchange = () => {
    render(sel.value);
    const url = new URL(location.href);
    url.searchParams.set('country', sel.value);
    history.replaceState(null, '', url);
  };
}

/* ---------- Init ---------- */
(async () => {
  let code = await detectCountry();
  if (!COUNTRIES[code]) code = DEFAULT_COUNTRY; // país sin configurar → por defecto
  document.getElementById('geo-detected').textContent =
    (COUNTRIES[code] ? COUNTRIES[code].flag + ' ' + COUNTRIES[code].label : code);
  buildSelector(code);
  render(code);
})();
</script>
